name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            x86: OFF
          - arch: x86
            x86: ON
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib g++-multilib
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOICE_X86=${{ matrix.x86 }}
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: gmsv_voice-linux-${{ matrix.arch }}
          path: build/gmsv_voice_*.dll

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: gmsv_voice-windows-${{ matrix.arch }}
          path: build/Release/gmsv_voice_*.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/gmsv_voice_*.dll
